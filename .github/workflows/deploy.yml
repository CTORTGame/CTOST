name: Deploy to GitHub Pages

on:
  # 推送到 main 分支时自动部署
  push:
    branches: [main]
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

# 部署 Pages 所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，避免并发冲突
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Pages 尚未启用时，自动通过 API 启用并设为 Actions 构建
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 站点根目录即仓库根目录（.nojekyll 确保跳过 Jekyll）
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
